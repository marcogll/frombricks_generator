version: '3.8'

services:
  formbricks-studio:
    build: .
    container_name: formbricks-studio
    ports:
      - "23457:23457"
    environment:
      - PORT=23457
      - FLASK_DEBUG=0
      - FORMBRICKS_BASE_URL=${FORMBRICKS_BASE_URL}
      - FORMBRICKS_API_KEY=${FORMBRICKS_API_KEY}
    volumes:
      - ./config.toml:/app/config.toml
      - ./auth.json:/app/auth.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:23457/"]
      interval: 30s
      timeout: 10s
      retries: 3
