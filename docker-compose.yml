version: '3.8'

services:
  formbricks-generator:
    build: .
    container_name: formbricks-studio
    ports:
      - "23457:23457"
    environment:
      - PORT=23457
      - FLASK_DEBUG=0
      - FORMBRICKS_ENVIRONMENTS=${FORMBRICKS_ENVIRONMENTS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:23457/"]
      interval: 30s
      timeout: 10s
      retries: 3