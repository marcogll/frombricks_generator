<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formbricks Studio - Login</title>
  <style>
    :root, [data-theme="dark"] {
      --bg: #111116;
      --surface: #1a1a22;
      --surface2: #2a2a35;
      --border: #3a3a48;
      --text: #d4d4dc;
      --text2: #9494a8;
      --accent: #818cf8;
      --accent2: #6366f1;
      --green: #6ee7b7;
      --red: #f87171;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface2: #e0e0e0;
      --border: #cccccc;
      --text: #1a1a1a;
      --text2: #666666;
      --accent: #6366f1;
      --accent2: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at top, #1a1b26 0%, #0f0f14 100%);
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .login-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 40px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .brand-logo img {
      height: 28px;
      filter: brightness(0) invert(1);
    }
    .brand-logo h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .login-title {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
      color: var(--text);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      transition: all .15s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.2);
    }
    .btn {
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(122, 162, 247, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(122, 162, 247, 0.4);
    }
    .error {
      background: rgba(247, 118, 142, 0.15);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--text2);
      margin-top: 20px;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text2);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <div class="brand-logo">
          <img src="https://formbricks.com/_next/static/media/footerlogo-dark.65287927.svg" alt="Formbricks">
          <h1>Lazy</h1>
        </div>
      </div>

      <h2 class="login-title">
        {% if not is_setup %}🔧 Initial Setup{% else %}🔐 Sign In{% endif %}
      </h2>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">
          {% if not is_setup %}Create Account{% else %}Sign In{% endif %}
        </button>
      </form>

      <div class="hint">
        {% if not is_setup %}
          Create your first user to access the system
        {% endif %}
      </div>

      <div class="footer">
        <div>made by &amp; for lazy people who don't like repetitive tasks</div>
        <div style="margin-top:8px;opacity:.4">
          <a href="https://soul23.mx" target="_blank" rel="noopener">
            <img src="https://raw.githubusercontent.com/marcogll/mg_data_storage/refs/heads/main/soul23/logo/s23_logo.svg" alt="Soul23" style="height:28px;filter:brightness(0) invert(1)">
          </a>
        </div>
      </div>
      </div>
    </div>
  </div>
</body>
</html>
