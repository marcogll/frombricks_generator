[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lazy-formbricks-studio"
version = "1.0.0"
description = "Visual survey builder & CLI manager for Formbricks — made by & for lazy people"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["formbricks", "survey", "feedback", "cli", "tui"]

authors = [
    {name = "MG"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]

dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.urls]
Source = "https://github.com/marcogll/frombricks_generator"
BugTracker = "https://github.com/marcogll/frombricks_generator/issues"

[tool.setuptools.packages.find]
include = ["client*", "ui*", "web*", "eval*", "shared*"]
